# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "946c7f95fc6780b88559e90d45ad7f96"
name = "Blogger React - Local"
application_url = "https://example.com"
embedded = true

[auth]
redirect_urls = [
  "https://example.com/api/auth/callback",
]

[access_scopes]
scopes = "read_content,write_content,read_products,write_products,read_customers,read_orders,read_themes,write_themes,read_script_tags,write_script_tags,write_files,read_locales,read_translations,write_translations"

[webhooks]
api_version = "2025-10"

  [[webhooks.subscriptions]]
  topics = [
    "app/uninstalled",
    "app_subscriptions/update",
    "orders/create",
    "checkouts/create"
  ]
  uri = "/api/webhooks"

  # Mandatory compliance (GDPR) webhooks — required for App Store distribution. Handlers already
  # exist and are wired up in privacy.js (imported into index.js's webhookHandlers) — this block
  # is what tells Shopify's CLI to actually create the subscriptions on `shopify app deploy`.
  [[webhooks.subscriptions]]
  compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
  uri = "/api/webhooks"

[pos]
embedded = false

[build]
automatically_update_urls_on_dev = true

[app_proxy]
url = "https://example.com/api/proxy"
subpath = "blog-analytics"
prefix = "apps"
