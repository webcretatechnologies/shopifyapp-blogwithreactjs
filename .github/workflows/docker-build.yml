# Builds the production image and pushes it to GHCR.
# Server deploys (`./deploy.sh`) only pull this image — no build on the host.
#
# Trigger: push to main (same role as B2B's master branch).
# Merge development → main when you want a production image + deploy.
name: Build and Push Docker Image

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # The Dockerfile's SHOPIFY_API_KEY ARG gets baked into the frontend bundle during
          # `npm run build` (web/frontend) — it's Shopify's public app key, not the secret half
          # (SHOPIFY_API_SECRET), so it's sourced from a repo Variable rather than a Secret.
          # Without this, the image builds with an empty key and App Bridge fails to init.
          build-args: |
            SHOPIFY_API_KEY=${{ vars.SHOPIFY_API_KEY }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
