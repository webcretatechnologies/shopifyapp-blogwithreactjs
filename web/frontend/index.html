<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <!-- Ensures that the UI is properly scaled in the Shopify Mobile app -->
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <script type="module">
      if (!import.meta.env || !import.meta.env.PROD) {
        // Because the base HTML is rendered in the server side, we need to manually embed the code to enable HMR in our
        // code, so that the vite server is properly enabled to run HMR
        const script = document.createElement('script');
        script.setAttribute('type', "module");
        script.setAttribute('src', "/dev_embed.js");
        document.getElementsByTagName('head')[0].append(script);
      }
    </script>

    <meta name="shopify-api-key" content="%VITE_SHOPIFY_API_KEY%" />
    <!-- Must stay exactly here: a literal, synchronous, non-module first-loaded <script> tag
         pointing straight at Shopify's CDN. App Bridge enforces this itself and hard-aborts
         ("must be included as the first <script> tag... Do not use async, defer or type=module")
         if it's instead injected dynamically — which is what broke the embedded merchant app when
         this was changed to a conditional runtime-injected script to silence a harmless
         console-only "missing shop" error on the separate, non-embedded /admin/* panel. That
         error doesn't affect the admin panel's functionality, so it's not worth breaking this. -->
    <script src="https://cdn.shopify.com/shopifycloud/app-bridge.js"></script>
  </head>
  <body>
    <div id="app"><!--index.jsx injects App.jsx here--></div>
    <script type="module" src="/index.jsx"></script>
  </body>
</html>
